<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>secondnature</title>
<style>
/* The secondnature design system (its tokens, layout rules and components live in a Claude Design artifact):
   a sidebar, four tabs, and a 12-column grid of panels with rows. The older names below (--group, --on, --link…)
   map onto its tokens so every part of the page shares them. No web fonts are loaded, so the page makes no
   requests off this machine: Geist is used where it's installed, else the system font. */
:root {
  --bg: #f6f6f4; --sidebar: #eeeeeb; --group: #ffffff; --fill: #f1f1ee; --line: #e3e3df; --line-strong: #cbcbc6;
  --ink: #17181b; --muted: #5c5e66; --faint: #71747c;
  --link: #2b3ab8; --chip: #edeffe; --on: #1b6e3e; --on-bg: #e4f3ea; --off: #cbcbc6;
  --warn: #b23e06; --warn-bg: #fdf0e8; --on-warn: #ffffff; --caution: #7a5200; --caution-bg: #fff4d6;
  --diff-add: #067647; --diff-del: #b42318;
  --sans: "Geist", -apple-system, "SF Pro Text", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sidebar-width: 232px; --radius-sm: 5px; --radius-md: 8px; --radius-lg: 12px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111214; --sidebar: #151618; --group: #1a1b1e; --fill: #0e0f11; --line: #2a2c30; --line-strong: #3b3e43;
    --ink: #ededef; --muted: #a2a5ad; --faint: #83868e;
    --link: #8d98ff; --chip: #20244a; --on: #58c88a; --on-bg: #13281c; --off: #3b3e43;
    --warn: #ff9a66; --warn-bg: #33200f; --on-warn: #1a0d05; --caution: #e8b54a; --caution-bg: #2e2410;
    --diff-add: #6cd49a; --diff-del: #ff8a80; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; } /* a class that sets display mustn't bring back something hidden */
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/21px var(--sans); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* The shell: sidebar, then the page on a 12-column grid. */
.shell { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--sidebar); border-right: 1px solid var(--line); padding: 14px 12px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.wordmark { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; padding: 4px 8px; }
.repopick { display: flex; flex-direction: column; gap: 2px; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--group); }
.repopick small { font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.repopick select { border: 0; background: none; padding: 0; font-weight: 500; cursor: pointer; width: 100%; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: var(--radius-md); color: var(--muted); font-weight: 500; cursor: pointer; }
.nav button:hover { background: var(--fill); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--group); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.nav button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.count { font: 600 11px/16px var(--mono); padding: 1px 7px; border-radius: 999px; background: var(--warn); color: var(--on-warn); }
.sidefoot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 8px; font-size: 12px; line-height: 17px; color: var(--muted); }
.sidefoot .linkbtn { font-size: 12px; }
main { min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 72px; }
.grid { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; align-items: start; }
.s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s7 { grid-column: span 7; } .s6 { grid-column: span 6; } .s5 { grid-column: span 5; } .s4 { grid-column: span 4; }
.stack { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
@media (max-width: 1100px) { .s8, .s7, .s6, .s5, .s4 { grid-column: 1 / -1; } }
@media (max-width: 860px) { .shell { grid-template-columns: 1fr; } .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); } .nav { flex-direction: row; flex-wrap: wrap; } .sidefoot { margin-top: 0; } }
.pagehead { grid-column: 1 / -1; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.crumb { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 32px; text-wrap: balance; }
.lead { margin: 4px 0 0; color: var(--muted); max-width: 72ch; }
section { min-width: 0; }
h2 { margin: 0 0 8px 2px; font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.group { list-style: none; margin: 0; padding: 0; background: var(--group); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
.group > li { border-top: 1px solid var(--line); }
.group > li:first-child { border-top: 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 44px; }
.row .main { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 0; cursor: pointer; }
.row .title { color: var(--ink); }
.row .sub { font-size: 12px; line-height: 17px; color: var(--muted); margin-top: 2px; }
.row .warnline { font-size: 12px; color: var(--warn); margin-top: 2px; }
.row.off .title { color: var(--faint); }
.note { margin: 8px 2px 0; font-size: 12px; line-height: 17px; color: var(--muted); }
/* Status labels: always a word. Helping/approved green, still happening/sent back orange, not reaching amber. */
.status { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: 999px; font-size: 12px; line-height: 18px; font-weight: 600; white-space: nowrap; background: var(--fill); color: var(--muted); }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status.good { background: var(--on-bg); color: var(--on); } .status.warn { background: var(--warn-bg); color: var(--warn); } .status.caution { background: var(--caution-bg); color: var(--caution); }
.tag { display: inline-block; padding: 0 7px; border-radius: var(--radius-sm); background: var(--chip); color: var(--link); font: 500 12px/18px var(--mono); }
.kind { display: inline-block; padding: 0 7px; border-radius: var(--radius-sm); background: var(--fill); font-size: 12px; line-height: 18px; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); background: var(--group); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
.stat { padding: 12px 16px; border-left: 1px solid var(--line); } .stat:first-child { border-left: 0; }
.stat b { display: block; font: 500 22px/28px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.stat b.warn { color: var(--warn); }
.stat span { font-size: 12px; line-height: 17px; color: var(--muted); }
.panelhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); min-height: 44px; }
.panelhead h2 { margin: 0; }
.panel { background: var(--group); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; min-width: 0; }
.panelbody { padding: 14px 16px; }
.tablewrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 19px; }
table.data th { text-align: left; font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 9px 16px; background: var(--fill); border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data td { padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data tr:last-child td { border-bottom: 0; }
table.data .num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data .rowlink { all: unset; cursor: pointer; font-weight: 500; color: var(--ink); }
table.data .rowlink:hover { text-decoration: underline; }
table.data .rowlink:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--radius-md); background: var(--fill); border: 1px solid var(--line); }
.seg button { border: 0; background: none; color: var(--muted); font-size: 13px; line-height: 18px; font-weight: 500; padding: 5px 12px; border-radius: var(--radius-sm); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--group); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
/* Autonomous runs: cost per role as bars, then what happened in order, then what your Claude found. */
.rundetail { padding: 4px 18px 18px; }
.rundetail h3 { margin: 16px 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.rolebar { display: grid; grid-template-columns: minmax(90px, 140px) 1fr; gap: 4px 12px; align-items: center; font-size: 14px; padding: 4px 0; }
/* A share of a total: the name and figure on one line, the bar under them, details below. */
.meter { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font-size: 13px; }
.meter .val { font: 500 12px/18px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.meter .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.meter .bar span { display: block; height: 100%; background: var(--link); border-radius: 3px; }
.meter .what { grid-column: 1 / -1; font-size: 12px; line-height: 17px; color: var(--muted); }
.rolebar .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.rolebar .bar span { display: block; height: 100%; background: var(--link); border-radius: 4px; }
.rolebar .what { grid-column: 2; font-size: 12px; color: var(--muted); }
.timeline { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.timeline li { display: grid; grid-template-columns: 48px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.timeline li:first-child { border-top: 0; }
.timeline time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; padding-top: 1px; }
.timeline .said { display: block; font-size: 13px; color: var(--muted); }
.timeline .back, .finding .back, .row .sub .back, .rolebar .back { color: var(--warn); font-weight: 500; }
.timeline .ok { color: var(--on); font-weight: 500; }
.timeline .idle { color: var(--muted); font-style: italic; }
.finding { padding: 6px 0; font-size: 14px; }
.finding .kind { font-size: 12px; font-weight: 600; color: var(--muted); margin-right: 6px; }
.rolechip { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--chip); color: var(--link); margin-right: 6px; }
.more { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 14px 18px; color: var(--link); font-weight: 500; cursor: pointer; }
.add { height: 32px; padding: 0 14px; border: 1px solid var(--ink); border-radius: var(--radius-md); background: var(--ink); color: var(--group); font-size: 14px; font-weight: 500; cursor: pointer; flex: none; }
.x { height: 32px; padding: 0 10px; border: 0; border-radius: var(--radius-md); background: none; color: var(--muted); cursor: pointer; flex: none; font-size: 14px; }
.x.icon { width: 32px; padding: 0; font-size: 16px; color: var(--faint); }
.x:hover { background: var(--fill); color: var(--ink); }
.switch { width: 36px; height: 20px; border-radius: 999px; border: 0; padding: 0; background: var(--off); position: relative; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--on); }
.switch[aria-checked="true"]::after { left: 18px; }
.switch:disabled { opacity: .5; cursor: default; }
.detail { padding: 4px 18px 18px; }
.detail label, .detail .lbl { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--group); font: 14px/1.6 var(--mono); resize: vertical; }
input[type=text] { width: 100%; height: 40px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--group); padding: 0 12px; margin-top: 8px; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices button { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--group); cursor: pointer; font-size: 14px; }
.choices button[aria-checked="true"] { border-color: var(--ink); background: var(--ink); color: var(--group); }
.checkline, .detail .checkline { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 400; margin-top: 14px; width: auto; }
.checkline input { margin: 0; width: 16px; height: 16px; flex: none; }
.hint { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.replay { margin-top: 10px; }
.replaylist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.replaylist .mono { font-size: 12px; margin-top: 2px; }
.replaylist li, .replaylist .sub { font-size: 12px; font-weight: 400; color: var(--muted); padding: 0; }
.btns { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
.btn { height: 34px; padding: 0 14px; border-radius: var(--radius-md); border: 1px solid var(--line-strong); background: var(--group); cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--fill); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--group); }
.btn.ask { border-color: transparent; background: var(--chip); color: var(--link); }
.btn.textbtn { border: 0; background: none; padding: 0; height: auto; color: var(--warn); margin-left: auto; }
.fix { height: 30px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 6px; }
.evidence { font-size: 13px; color: var(--muted); margin-top: 12px; }
/* An agent's search answer, one card per match. */
.match { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; margin-top: 6px; }
.match > summary { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding: 8px 12px; cursor: pointer; }
.match > summary .peek { flex: 1 1 260px; min-width: 0; font-size: 13px; color: var(--muted); }
.match[open] > summary .peek { display: none; }
.matchbody { padding: 0 12px 10px; font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; max-height: 460px; overflow: auto; }
.turn { display: grid; grid-template-columns: 52px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.turn:first-child { border-top: 0; }
.turn .who { font-size: 12px; font-weight: 600; color: var(--muted); }
.cutmark { margin: 6px 0; padding: 3px 8px; border: 1px dashed var(--line); border-radius: 6px; font-size: 12px; color: var(--caution); background: var(--caution-bg); }
.evidence .run { margin-top: 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; color: var(--ink); white-space: pre-wrap; }
.empty { padding: 16px 18px; color: var(--muted); }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--group); cursor: pointer; flex: none; padding: 0; }
.check:hover { border-color: var(--on); }
.check[aria-checked="true"] { background: var(--on); border-color: var(--on); }
.sublist { list-style: none; margin: 0; padding: 0 18px 12px; }
.mono { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
code { font: .9em var(--mono); background: var(--fill); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
pre code { background: none; padding: 0; }
.diff { white-space: pre-wrap; font: 12px/1.5 var(--mono); background: var(--fill); border-radius: 8px; padding: 10px; margin: 8px 0 0; max-height: 220px; overflow: auto; }
.diff .plus { color: var(--diff-add); } .diff .minus { color: var(--diff-del); }
/* One look for the repo and branch pickers. */
.picker { border: 0; background: none; color: var(--ink); font-size: 14px; font-weight: 600; padding: 2px 0; cursor: pointer; }
.field { flex: 1 1 260px; min-width: 0; height: 40px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 12px; font-size: 15px; background: var(--bg); color: var(--ink); }
.rowlabel { padding: 12px 18px 0; font-size: 13px; color: var(--muted); }
.donebox input[type=search] { margin: 0 18px 10px; width: calc(100% - 36px); box-sizing: border-box; }
.doneday { padding: 6px 18px 0; font-size: 13px; color: var(--muted); font-weight: 600; }
.sublist li { padding: 6px 0; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.sublist .x { width: 26px; height: 26px; font-size: 15px; margin-left: auto; }
.scan { margin: 10px 0 0; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--link); font-size: 14px; font-weight: 500; cursor: pointer; }
.linkbtn:disabled { opacity: .5; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--ink); animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--group); padding: 9px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .switch, .switch::after, .toast { transition: none; } }
/* Ask secondnature: a panel on the right; the page moves over on wide screens and it covers the page on narrow ones. */
.askbtn { margin-left: auto; height: 32px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--chip); color: var(--link); font-size: 14px; font-weight: 600; cursor: pointer; }
.askpanel { position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 100%; background: var(--group); border-left: 1px solid var(--line-strong); display: flex; flex-direction: column; z-index: 5; }
@media (min-width: 1100px) { body.ask-open .shell { margin-right: 440px; } }
.askhead { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 18px; border-bottom: 1px solid var(--line); }
.askttl { flex: 1; margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.askbody { flex: 1; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 22px; }
.askempty p { margin: 0 0 8px; } .askempty .sub { font-size: 14px; color: var(--muted); }
.asktry { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 14px; }
.asktry .hchip { text-align: left; padding: 6px 13px; line-height: 1.35; }
.turn { display: flex; flex-direction: column; gap: 10px; }
.askq-b { align-self: flex-end; max-width: 85%; background: var(--ink); color: var(--group); padding: 9px 14px; border-radius: 14px 14px 4px 14px; font-size: 15px; }
.aska { font-size: 15px; line-height: 1.6; }
.cite { border: 0; background: var(--chip); color: var(--link); font: 600 12px/1 var(--sans); padding: 3px 6px; margin: 0 1px; border-radius: 6px; cursor: pointer; vertical-align: 1px; }
.cite:hover, .cite:focus-visible { background: var(--link); color: var(--group); }
.askprog { display: flex; flex-direction: column; gap: 9px; padding: 12px 14px; border-radius: 12px; background: var(--bg); }
.askprog-h { font-size: 14px; font-weight: 600; }
.askstep { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.askstep.done { color: var(--on); } .askstep.later { color: var(--faint); }
.askstep .spin { margin: 2px; } .askstep .dot { width: 12px; height: 12px; margin: 2px; border-radius: 50%; border: 2px solid var(--line-strong); flex: none; }
.askprog-t { font-size: 12px; color: var(--muted); }
.askerr { color: var(--warn); } .asknone { color: var(--muted); margin: 0; }
.srcs-h { font-size: 12px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.srcs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.src { display: flex; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; transition: border-color .2s, background .2s; scroll-margin: 12px; }
.src.lit { border-color: var(--link); background: var(--chip); }
.srcn { flex: none; width: 22px; height: 22px; border-radius: 6px; background: var(--chip); color: var(--link); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.src.lit .srcn { background: var(--link); color: var(--group); }

<body>
<div class="shell"><aside id="side" class="side" aria-label="secondnature"></aside><main id="main" aria-live="polite"></main></div>

/* The running plan: built from your sessions' handoffs, and yours to edit. */

/* Changes secondnature proposes to files agents read: ask-first rules, new skills, edits to CLAUDE.md. Nothing is written until Apply. */

const roleChip = (l) => (l.role ? `<span class="rolechip">For the ${esc(l.role === "main" ? "main session" : l.role)}</span>` : "");
/** Under the timing choices: who hears a role lesson, since "every session" then means that role's sessions only. */
const roleNote = (l) => (l.role ? `<p class="note" style="margin-left:0">Only agents working as the ${esc(l.role)} are told this: in its worktree, or as that kind of subagent. Other agents aren't.</p>` : "");

/* muninn checks your sessions on its own after they end. This line shows when it last did, and lets you ask now. */
function scanLine() {
  const s = data.scan;
  if (s.running) return `<span class="spin" aria-hidden="true"></span> Checking your sessions for new lessons. New suggestions appear here when it's done.`;
  if (s.needsModel) return `secondnature can't check your sessions until its local model is downloaded (about 33 MB). Run <code>muninn learn --all-repos</code> once in a terminal.`;
  return `${s.lastLearn ? `secondnature checked your sessions ${esc(ago(s.lastLearn))}` : "secondnature hasn't checked your sessions yet"}, and checks again on its own after you work${data.schedule?.on ? ` and every ${data.schedule.everyHours} hours in the background` : ""}. <button class="linkbtn" data-scan>Check now</button>`;
}
let scanPoll = null;
/** Follows a running scan, then refreshes and says what it found. Also used when a scan started on its own. */
function followScan(before) {
  if (scanPoll) return;
  scanPoll = setInterval(async () => {
    const s = await api("/api/scan").catch(() => null);
    if (!s || s.running) return;
    clearInterval(scanPoll); scanPoll = null; await refresh();
    const found = data.suggested.length - before;
    toast(found > 0 ? `Found ${found} new suggestion${found === 1 ? "" : "s"}.` : "Checked your sessions. Nothing new this time.");
  }, 4000);
}
async function startScan(btn) {
  if (btn) btn.disabled = true;
  const before = data.suggested.length;
  await api("/api/scan", {});
  data.scan.running = true; draw();
  followScan(before);
}

/* When a kept lesson is told, in words. */
function whenText(l) {
  const w = l.always_on ? "Every session" : l.triggers.length ? `When "${l.triggers.join('", "')}" comes up` : "Only when searched";
  return w + (l.scope === "global" ? " · all repos" : !repo ? ` · ${short(l.repo_id)}` : "");
}
function whenChoices(route, kws) {
  return `<span class="lbl">When to tell agents</span>
    <div class="choices" role="radiogroup" aria-label="When to tell agents">${["always", "keyword", "none"].map((r) => `<button role="radio" data-route="${r}" aria-checked="${r === route}">${WHEN[r]}</button>`).join("")}</div>
    <p class="hint" data-when-hint>${WHEN_HINT[route]}</p>
    <input type="text" data-f="kw" placeholder="Words that should bring it up, comma-separated" value="${esc(kws)}" ${route === "keyword" ? "" : "hidden"}>
    <div class="replay"><button class="linkbtn" data-replay>When would this have been told?</button><div data-replay-out></div></div>`;
}

function suggestionRow(l) {
  const d = l.defaults;
  const isOpen = open === l.id;
  // From commands, the evidence is the runs themselves, shown as they were; from what you typed, your words.
  const runs = (l.evidence || []).some((e) => e.quote.startsWith("$ "));
  const ev = (l.evidence || []).slice(0, 3).map((e) => runs ? `<div class="mono run">${esc(e.quote)}</div>` : `<div>"${esc(e.quote)}"</div>`).join("");
  return `<li data-id="${esc(l.id)}">
    <div class="row">
      <button class="main" data-open="${esc(l.id)}" aria-expanded="${isOpen}"><div class="title">${esc(l.plain || l.text)}</div><div class="sub">${roleChip(l)}${esc(l.origin)}</div>${l.why ? `<div class="sub why">Why: ${esc(l.why)}</div>` : ""}${l.worth ? `<div class="sub">${esc(l.worth)}</div>` : ""}</button>
      <button class="x" data-dismiss="${esc(l.id)}" title="Don't suggest this again">Dismiss</button>
      <button class="btn" data-open="${esc(l.id)}">Edit</button>
      <button class="add" data-add="${esc(l.id)}">Keep</button>
    </div>
    ${isOpen ? `<div class="detail">
      <label for="t-${esc(l.id)}">What agents are told</label>
      <textarea id="t-${esc(l.id)}" rows="3" data-f="text">${esc(l.text)}</textarea>
      ${whenChoices(d.route, (d.keywords.length ? d.keywords : l.suggested || []).join(", "))}${roleNote(l)}
      ${whereFields(l, l.scope === "global" || d.global)}
      ${ev ? `<div class="evidence">${runs ? "What ran in your session:" : ["repeat", "correction", "explained", "confused", "friction", "stated", "steered"].includes(l.signal) ? "You said:" : l.signal === "promised" ? "The agent said:" : l.signal === "sent_back" || l.signal === "missed" ? "What the agents said:" : l.signal === "unanswered" ? "What agents asked:" : "From your session:"} ${ev}</div>` : ""}
      <div class="btns"><button class="btn primary" data-add="${esc(l.id)}" data-custom="1">Keep</button><button class="btn" data-open="${esc(l.id)}">Cancel</button></div>
    </div>` : ""}
  </li>`;
}
function lessonRow(l) {
  const c = data.home.cameBack.find((x) => x.id === l.id);
  const last = data.home.carry.find((x) => x.id === l.id)?.lastTold;
  const route = l.always_on ? "always" : l.triggers.length ? "keyword" : "none";
  const isOpen = open === l.id;
  return `<li data-id="${esc(l.id)}">
    <div class="row ${l.off ? "off" : ""}">
      <button class="main" data-open="${esc(l.id)}" aria-expanded="${isOpen}">
        <div class="title">${esc(l.plain || l.text)}</div>
        <div class="sub">${roleChip(l)}${l.off ? "Off · agents aren't told this" : esc(whenText(l)) + (last ? ` · last told ${esc(ago(last))}` : "") + (data.lessonFinds[l.id] ? ` · found by agents ${data.lessonFinds[l.id]} time${data.lessonFinds[l.id] === 1 ? "" : "s"}` : "")}</div>
        ${(() => { const fx = !l.off && data.effects.find((x) => x.id === l.id); if (!fx) return ""; const [word, cls] = VERDICT[fx.verdict] || ["", ""]; return word ? `<div class="sub" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px"><span class="status ${cls}">${esc(word.replace("{role}", fx.role))}</span><span>${esc(fx.summary)}</span></div>` : ""; })()}
        ${l.missing?.length ? `<div class="warnline">Names ${l.missing.map((f) => `<code>${esc(f)}</code>`).join(", ")}, which ${l.missing.length === 1 ? "is" : "are"} no longer in the repo. The lesson may be out of date: edit it or switch it off.</div>` : ""}
        ${c && !l.off ? `<div class="warnline">The problem came back. ${esc(c.verdict.replace(/ Make it always-on\?$/, ""))}</div>` : ""}
      </button>
      <button class="switch" role="switch" aria-checked="${!l.off}" aria-label="${l.off ? "Off" : "On"}: ${esc(l.plain || l.text)}" data-toggle="${esc(l.id)}"></button>
    </div>
    ${c && c.fix && !l.off && !isOpen ? `<div style="padding:0 18px 12px"><button class="fix" data-fix="${esc(l.id)}">Tell agents every session</button></div>` : ""}
    ${isOpen ? `<div class="detail">
      <label for="t-${esc(l.id)}">What agents are told</label>
      <textarea id="t-${esc(l.id)}" rows="3" data-f="text">${esc(l.text)}</textarea>
      ${l.why ? `<p class="hint">Why: ${esc(l.why)}</p>` : ""}
      ${whenChoices(route, l.triggers.join(", "))}${roleNote(l)}
      ${whereFields(l, l.scope === "global")}
      <div class="btns"><button class="btn primary" data-save="${esc(l.id)}">Save</button><button class="btn" data-open="${esc(l.id)}">Cancel</button><button class="btn textbtn" data-remove="${esc(l.id)}">Remove lesson</button></div>
    </div>` : ""}
  </li>`;
}

function draw() {
  // The page redraws when muninn's data changes; keep the history search's focus. The ask panel keeps its own.
  const inHist = document.activeElement?.id === "histQ";
  drawPage();
  if (inHist) { const h = $("#histQ"); if (h) { h.focus(); h.setSelectionRange(h.value.length, h.value.length); } }
  if (!asking) drawAsk();
}
/* How many things wait for a yes or no in this repo: suggestions, proposed file changes, out-of-date CLAUDE.md lines. */
const waitingCount = () => data.suggested.length + (data.proposals?.waiting?.length || 0) + (data.memory || []).filter((m) => m.status === "open").length;
/* The tab open now: the one picked, or To review when something's waiting, else Lessons. */
const currentTab = () => tab || (waitingCount() ? "review" : "lessons");
function drawSide() {
  const { repos } = data;
  const t = currentTab(); const n = waitingCount();
  const othersWaiting = repo ? repos.some((r) => r.id !== repo && r.waiting) : false;
  const tabBtn = (id, label, extra = "") => `<button data-tab="${id}" ${t === id ? 'aria-current="page"' : ""}>${label}${extra}</button>`;
  $("#side").innerHTML = `
    <div class="wordmark">secondnature</div>
    <div class="repopick"><label for="repo"><small>Repo${othersWaiting ? ' · <span style="color:var(--warn)">others waiting</span>' : ""}</small></label>
      <select id="repo"><option value="" ${repo ? "" : "selected"}>All repos</option>${[...new Set([HERE, repo].filter((r) => r && !repos.some((x) => x.id === r)))].map((r) => `<option value="${esc(r)}" ${r === repo ? "selected" : ""}>${esc(short(r))}${r === HERE ? " (this folder)" : ""}</option>`).join("")}${repos.map((r) => `<option value="${esc(r.id)}" ${r.id === repo ? "selected" : ""}>${esc(short(r.id))}${r.waiting && r.id !== repo ? ` (${r.waiting} waiting)` : ""}</option>`).join("")}</select></div>
    <nav class="nav" aria-label="Sections">
      ${tabBtn("review", "To review", n ? `<span class="count">${n}</span>` : "")}
      ${tabBtn("lessons", "Lessons")}
      ${repo ? tabBtn("plan", "Plan") : ""}
      ${tabBtn("activity", "Activity")}
    </nav>
    <button class="btn ask" data-ask-open ${askOpen ? "hidden" : ""}>Ask about ${repo ? esc(short(repo)) : "your repos"}</button>
    <div class="sidefoot"><span>${scanLine()}</span>${tabBtn("settings", "Settings").replace("<button", '<button class="linkbtn" style="text-align:left"')}</div>`;
}
function drawPage() {
  drawSide();
  const t = currentTab();
  const body = t === "review" ? reviewView() : t === "lessons" ? lessonsView() : t === "plan" ? (repo && data.plan ? planSection() : lessonsView())
    : t === "activity" ? (runPage ? runPageView() : activityView()) : settingsView();
  $("#main").innerHTML = `<div class="grid">${body}</div>`;
}
/* To review: everything waiting for a yes or no, one queue. */
function reviewView() {
  const { suggested, kept, repos } = data;
  const n = waitingCount();
  const shown = showAll ? suggested : suggested.slice(0, 6);
  const others = repo ? repos.filter((r) => r.id !== repo && r.waiting) : [];
  const first = !suggested.length && !kept.length;
  return `<div class="pagehead"><div><h1>${n ? `${n} thing${n === 1 ? "" : "s"} need${n === 1 ? "s" : ""} you` : first ? "secondnature hasn't found anything yet" : "Nothing needs you"}</h1>
      <p class="lead">${first ? "It reads the logs your coding agents keep on this machine, finds what you keep telling them and what goes wrong, and suggests lessons for you to keep. Short, redacted excerpts go to your own Claude to write them." : "Nothing changes for your agents until you decide. Each one says where it came from and who it affects."}</p></div></div>
    <div class="stack s8">
      ${first ? `<div class="panel panelbody"><button class="btn primary" data-scan ${data.scan.running ? "disabled" : ""}>${data.scan.running ? "Checking…" : "Find lessons in my sessions"}</button><p class="note" style="margin:10px 0 0">Takes a few minutes. Suggestions appear here as each repo finishes.</p></div>` : ""}
      ${suggested.length ? `<section aria-labelledby="sg"><h2 id="sg">Told to agents · ${suggested.length}</h2>
        <ul class="group">${shown.map(suggestionRow).join("")}
          ${suggested.length > 6 ? `<li><button class="more" data-more>${showAll ? "Show fewer" : `See all ${suggested.length}`}</button></li>` : ""}</ul>
        <p class="note">Keep tells your agents from their next session. Edit to change the wording or when it's told first.</p></section>` : ""}
      ${data.proposals?.waiting?.length || data.proposals?.applied?.length ? changesSection() : ""}
      ${memorySection()}
      ${!n && !first ? `<ul class="group"><li class="empty">All caught up. New suggestions appear here as secondnature reads your sessions.</li></ul>` : ""}
    </div>
    <div class="stack s4">
      ${others.length ? `<section><h2>Waiting in other repos</h2><ul class="group">${others.map((r) => `<li><div class="row"><button class="main" data-repo="${esc(r.id)}"><div class="title" style="font-weight:500">${esc(short(r.id))}</div></button><span class="count">${r.waiting}</span></div></li>`).join("")}</ul></section>` : ""}
      ${repo ? `<section><h2>Instruction files</h2><div class="panel panelbody">${proposing ? `<span class="spin" aria-hidden="true" style="display:inline-block;vertical-align:-2px"></span> Your Claude is reviewing this repo's CLAUDE.md, AGENTS.md and skills…` : `<button class="btn" data-propose>Review CLAUDE.md and skills</button><p class="note" style="margin:10px 0 0">Checks CLAUDE.md, AGENTS.md and skills against your sessions and proposes edits here. One call to your Claude.</p>`}</div></section>` : ""}
      <section><h2>How these are found</h2><div class="panel panelbody" style="color:var(--muted);font-size:13px;line-height:19px">secondnature reads your agents' logs on this machine after each session${data.schedule?.on ? ` and every ${data.schedule.everyHours} hours` : ""}. It suggests a lesson when you say something more than once, state a rule, correct an agent, or when work keeps going wrong the same way.</div></section>
    </div>`;
}
/* Lessons: what agents are told, grouped by who hears it. */
function lessonsView() {
  const { kept, suggested } = data;
  const on = kept.filter((l) => !l.off), off = kept.filter((l) => l.off);
  const roles = on.filter((l) => l.role).sort((a, b) => a.role.localeCompare(b.role));
  const all = on.filter((l) => !l.role && l.scope === "global");
  const here = on.filter((l) => !l.role && l.scope !== "global");
  const group = (title, list, empty) => `<section><h2>${title} · ${list.length}</h2><ul class="group">${list.length ? list.map(lessonRow).join("") : `<li class="empty">${empty}</li>`}</ul></section>`;
  return `<div class="pagehead"><div><h1>What agents are told${repo ? ` in ${esc(short(repo))}` : ""}</h1>
      <p class="lead">Switch a lesson on and your Claude Code, Codex, Cursor and Antigravity agents are told it. Switch it off and they aren't. Tap one to change its wording or when it's told.</p></div></div>
    <div class="stack s8">
      ${!kept.length ? `<ul class="group"><li class="empty">${suggested.length ? `Nothing kept yet. ${suggested.length} suggestion${suggested.length === 1 ? " is" : "s are"} waiting in <button class="linkbtn" data-tab="review">To review</button>.` : "Nothing kept yet. Keep a suggestion and your agents are told it from their next session."}</li></ul>` : ""}
      ${roles.length ? group("One role only", roles, "") : ""}
      ${kept.length && repo ? group("This repo", here, `None yet. A lesson you keep for every agent in ${esc(short(repo))} shows here.`) : ""}
      ${kept.length ? group(repo ? "All repos" : "Kept", repo ? all : on.filter((l) => !l.role), "None yet.") : ""}
      ${off.length ? group("Switched off", off, "") : ""}
    </div>
    <div class="stack s4">
      <section><h2>When agents are told</h2><ul class="group">
        <li><div class="row"><div class="main" style="cursor:default"><div class="title" style="font-weight:500">Every session</div><div class="sub">At the start, before any work.</div></div></div></li>
        <li><div class="row"><div class="main" style="cursor:default"><div class="title" style="font-weight:500">When a word comes up</div><div class="sub">Mid-task, in your prompt or a failed command.</div></div></div></li>
        <li><div class="row"><div class="main" style="cursor:default"><div class="title" style="font-weight:500">On request</div><div class="sub">Only when an agent runs muninn ask.</div></div></div></li>
      </ul></section>
      ${roles.length ? `<section><h2>Is it helping?</h2><div class="panel panelbody" style="color:var(--muted);font-size:13px;line-height:19px">A role lesson is compared with how that role did before you kept it. After its runs it shows Helping, Still happening, or Not reaching the role, with the numbers.</div></section>` : ""}
    </div>`;
}
/* Activity: the week, runs and what they showed. */
function activityView() {
  const totals = data.runs.reduce((a, r) => { const n = data.runInfo[r.id]?.numbers; if (n) { a.tokens += n.tokens; a.approvals += n.approvals; a.rework += n.rework + n.sentBack; } return a; }, { tokens: 0, approvals: 0, rework: 0 });
  const byRole = new Map();
  for (const r of data.runs) for (const x of data.runInfo[r.id]?.numbers?.roles || []) byRole.set(x.role, (byRole.get(x.role) || 0) + x.tokens);
  const roles = [...byRole.entries()].sort((a, b) => b[1] - a[1]);
  const top = roles[0]?.[1] || 1;
  return `<div class="pagehead"><div><h1>Activity${repo ? ` in ${esc(short(repo))}` : ""}</h1><p class="lead">What your agents did, what it took, and what went wrong.</p></div></div>
    ${data.runs.length ? `<div class="stats s12">
      <div class="stat"><b>${data.runs.length}</b><span>run${data.runs.length === 1 ? "" : "s"} with more than one agent</span></div>
      <div class="stat"><b>${tok(totals.tokens)}</b><span>tokens across them</span></div>
      <div class="stat"><b>${totals.approvals}</b><span>approvals between agents</span></div>
      <div class="stat"><b${totals.rework ? ' class="warn"' : ""}>${totals.rework}</b><span>sent back or fixed after approval</span></div>
    </div>` : ""}
    <div class="stack s8">
      ${repo ? runsTable() : `<ul class="group"><li class="empty">Pick a repo to see its runs.</li></ul>`}

      ${toldSection()}
      <section aria-labelledby="wk"><h2 id="wk">Your last 7 days</h2>
        ${week ? `<div class="panel"><pre style="white-space:pre-wrap;font:12px/1.6 var(--mono);margin:0;padding:14px 16px">${esc(week)}</pre></div>`
          : `<div class="panel panelbody">${weekLoading ? `<span class="spin" aria-hidden="true" style="display:inline-block;vertical-align:-2px"></span> Reading the last 7 days of sessions…` : `<button class="btn" data-week>Show your last 7 days</button><p class="note" style="margin:10px 0 0">Where agents wasted effort, whether lessons helped, and what's waiting. Also <code>muninn insights</code>.</p>`}</div>`}
      </section>
    </div>
    <div class="stack s4">
      ${roles.length ? `<section><h2>Tokens by role</h2><div class="panel panelbody" style="display:grid;gap:10px">${roles.map(([role, t]) => `<div class="meter"><span>${esc(roleName(role))}</span><span class="val">${tok(t)}</span><div class="bar"><span style="width:${Math.max(2, Math.round((t / top) * 100))}%"></span></div></div>`).join("")}<div class="note" style="margin:0">Most is reading: context taken in, not code written.</div></div></section>` : ""}
    </div>`;
}
/* What secondnature told agents this week through its hooks: each session, what it got, and when nothing was sent, why. */
const OUTCOME = { sent: ["told", "good"], no_match: ["checked, nothing fit", ""], limit: ["not sent: no room left", "caution"], paused: ["paused or set to quiet", "caution"], timeout: ["too slow, skipped", "warn"], unsupported_client: ["tool can't take it", "warn"] };
function toldSection() {
  const t = data.told;
  if (!t) return "";
  const total = Object.values(t.outcomes).reduce((a, b) => a + b, 0);
  const strip = Object.entries(t.outcomes).sort((a, b) => b[1] - a[1]).map(([o, n]) => { const [word, cls] = OUTCOME[o] || [o, ""]; return `<span><b>${n}</b> <span class="status ${cls}">${esc(word)}</span></span>`; }).join("");
  const item = (x) => `<div style="margin:2px 0"><span class="tag">${{ handoff: "where you left off", plan: "plan", note: "reminder" }[x.kind] || "lesson"}</span> ${esc(clip(x.text, 110))} <span style="color:var(--muted)">· ${esc(x.why)}</span></div>`;
  const rows = t.sessions.slice(0, 10).map((s) => {
    const nothing = Object.entries(s.outcomes).filter(([o]) => o !== "sent").map(([o, n]) => `${n} ${(OUTCOME[o] || [o])[0]}`).join(" · ");
    const got = s.told.map(item).join("")
      + (s.fromFile ? `<div style="margin:2px 0;color:var(--muted)">${s.fromFile} lesson${s.fromFile === 1 ? "" : "s"} already in CLAUDE.local.md, which it read itself</div>` : "")
      + s.loops.map((l) => `<div style="margin:2px 0"><span class="status warn">loop warning</span> <code>${esc(clip(l.cmd, 60))}</code> failed ${l.n} times</div>`).join("")
      + (s.held.length ? `<div style="margin:2px 0"><span class="status caution">not sent, no room</span> ${s.held.map((h) => esc(clip(h.text, 60))).join(" · ")}</div>` : "");
    return `<tr><td style="white-space:nowrap;color:var(--muted)">${esc(shortDate(s.start))}, ${esc(clock(s.start))}</td><td>${esc(TOOL_NAMES[s.tool] || s.tool)}<div style="font:500 12px/17px var(--mono);color:var(--muted)">${esc(s.session.slice(0, 8))}</div></td><td>${got || '<span style="color:var(--muted)">Nothing told</span>'}${nothing ? `<div class="note" style="margin:4px 0 0">${esc(nothing)}</div>` : ""}</td></tr>`;
  }).join("");
  const how = (l) => l.how === "always" ? (l.role ? `goes only to agents in the ${l.role} role, and none got it (see Lessons for why)` : "goes to every session, yet none got it")
    : l.how === "keyword" ? `waits for ${l.keywords.slice(0, 4).map((k) => `"${k}"`).join(", ")}, which never came up` : "only if an agent looks it up, and none did";
  // Flagged only once enough sessions here have run since it was kept; until then it is too early to say.
  const late = t.neverTold.filter((l) => !l.tooEarly), early = t.neverTold.filter((l) => l.tooEarly);
  const since = (l) => `${l.sessionsSince} session${l.sessionsSince === 1 ? "" : "s"} here since it was kept`;
  const never = late.slice(0, 8).map((l) => `<li><div class="row"><div class="main"><div class="title">${esc(clip(l.text, 140))}</div><div class="sub"><span class="status warn">not told in ${esc(since(l))}</span> ${esc(how(l))}</div></div></div></li>`).join("");
  const wait = early.slice(0, 8).map((l) => `<li><div class="row"><div class="main"><div class="title">${esc(clip(l.text, 140))}</div><div class="sub">Kept ${esc(ago(l.kept))}, ${esc(since(l))}${l.role ? ` · goes only to agents in the ${esc(l.role)} role` : ""}</div></div></div></li>`).join("");
  return `<section><h2>What secondnature told agents · ${t.sessions.length} session${t.sessions.length === 1 ? "" : "s"}</h2>

    }
    if (el.dataset.propApply || el.dataset.propDismiss || el.dataset.propUndo) {
      const action = el.dataset.propApply ? "apply" : el.dataset.propDismiss ? "dismiss" : "undo";
      try {
        const r = await api("/api/proposals", { id: el.dataset.propApply || el.dataset.propDismiss || el.dataset.propUndo, action });
        data.proposals = await api("/api/proposals?" + q({ repo })); draw();
        toast(action === "apply" ? `Applied. Changed ${(r.files || []).map((f) => f.split("/").slice(-2).join("/")).join(", ")}. Undo is below.` : action === "dismiss" ? "Dismissed. secondnature won't propose it again." : "Undone: the file is back as it was.");
      } catch (e) { toast(e.message || String(e)); }
      return;
    }
    if (el.dataset.askOpen !== undefined) { setAskOpen(true); draw(); return; }
    if (el.dataset.askClose !== undefined) { setAskOpen(false); draw(); return; }
    if (el.dataset.askView) { askView = el.dataset.askView; drawAsk(); return; }
    if (el.dataset.askClear !== undefined) { askThread = []; askThreadId = null; askView = "chat"; drawAsk(); $("#askq")?.focus(); return; }
    if (el.dataset.askTry) { if (!asking) await askNow(el.dataset.askTry); return; }
    if (el.dataset.askAll) { askThread[Number(el.dataset.askAll)].allSources = true; drawAsk(); return; }
    if (el.dataset.cite) {
      const [ti, n] = el.dataset.cite.split(":"); const t = askThread[Number(ti)];
      if (t && !$(`#src-${ti}-${n}`)) { t.allSources = true; drawAsk(); }
      const card = $(`#src-${ti}-${n}`); if (!card) return;
      card.scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
      document.querySelectorAll(".src.lit").forEach((c) => c.classList.remove("lit")); card.classList.add("lit");
      return;
    }
    if (el.dataset.reveal) { await api("/api/reveal", { session: el.dataset.reveal }); toast("Opened the folder with that session's log."); return; }
    if (el.dataset.threadOpen) {
      const t = await api("/api/thread?" + q({ id: el.dataset.threadOpen }));
      askThreadId = t.id; askThread = t.turns.map((u) => ({ q: u.q, a: u.a, sources: u.sources })); askView = "chat"; drawAsk(); scrollAskEnd(); $("#askq")?.focus(); return;
    }
    if (el.dataset.threadDelete) {
      await api("/api/thread-delete", { id: el.dataset.threadDelete }); data.threads = data.threads.filter((t) => t.id !== el.dataset.threadDelete);
      if (askThreadId === el.dataset.threadDelete) { askThread = []; askThreadId = null; }
      drawAsk(); toast("Deleted that chat."); return;
    }
    if (el.dataset.runView) { runViewPick[runPage] = el.dataset.runView; draw(); return; }
    if (el.dataset.tab) { tab = el.dataset.tab; runPage = null; open = null; rememberPick(); draw(); window.scrollTo(0, 0); return; }
    if (el.dataset.runOpen) { runPage = el.dataset.runOpen; tab = "activity"; rememberPick(); draw(); window.scrollTo(0, 0); return; }
    if (el.dataset.runAll) { const id = el.dataset.runAll; if (runAll.has(id)) runAll.delete(id); else runAll.add(id); draw(); return; }
    if (el.dataset.runFind) {
      const run = data.runs.find((r) => r.id === el.dataset.runFind); if (!run) return;
      runFinding = run.id; if (data.runInfo[run.id]) data.runInfo[run.id].findings = null; draw();
      try { const f = await api("/api/run-findings", { action: "find", run }); if (data.runInfo[run.id]) data.runInfo[run.id].findings = f; }
      catch (e) { toast(e.message || String(e)); }
      runFinding = null; draw(); return;
    }
    if (el.dataset.week !== undefined) {
      weekLoading = true; draw();
      try { week = (await api("/api/insights?" + q({ repo }))).text; } catch (e) { toast(e.message || String(e)); }
      weekLoading = false; draw(); return;
    }
    if (el.dataset.propose !== undefined) {
      proposing = true; draw();
      try { const r = await api("/api/propose", { repo }); data.proposals = await api("/api/proposals?" + q({ repo })); toast(r.proposed ? `${r.proposed} edit(s) proposed.` : "Nothing clearly worth changing right now."); }
      catch (e) { toast(e.message || String(e)); }
      proposing = false; draw(); return;
    }
    if (el.dataset.rules) {
      const on = el.getAttribute("aria-checked") !== "true";
      data.rules = await api("/api/rules", { repo, tool: el.dataset.rules, on }); draw();
      toast(on ? "Rules files written. Its agent gets your lessons." : "Rules files removed. secondnature won't turn them back on here.");
      return;
    }
    if (el.dataset.schedule !== undefined) {
      const on = el.getAttribute("aria-checked") !== "true";
      try { data.schedule = await api("/api/schedule", { on }); } catch (e) { toast(e.message || String(e)); return; }
      draw(); toast(on ? `Background checks on. secondnature looks every ${data.schedule.everyHours} hours.` : "Background checks off. Scans start when a Claude Code or Codex session ends, or with Check now.");
      return;
    }
    if (el.dataset.lessonFile !== undefined) {
      const on = el.getAttribute("aria-checked") !== "true";
      const r = await api("/api/lesson-file", { repo, mode: on ? "local" : "off" }); data.lessonFile = r; draw();
      toast(r.mode === "local" ? (r.written ? "Always-on lessons are in CLAUDE.local.md at the root of this repo, and kept up to date." : "Turned on, but secondnature couldn't find this repo's folder. It writes the file the next time you work here.") : "Took muninn's lessons out of CLAUDE.local.md. Anything else in the file is left as it was."); return;
    }
    if (el.dataset.scan !== undefined) { await startScan(el); return; }
    if (el.dataset.repo) { week = null; repo = el.dataset.repo; open = null; showAll = false; runPage = null; await refresh(); window.scrollTo(0, 0); return; }
    if (el.dataset.replay !== undefined) {
      const box = el.closest(".detail"); const li = el.closest("li[data-id]");
      const l = [...data.suggested, ...data.kept].find((x) => x.id === li?.dataset.id);
      const route = box.querySelector("[data-route][aria-checked=true]").dataset.route;
      const out = box.querySelector("[data-replay-out]");
      out.innerHTML = `<p class="hint">Reading your past sessions…</p>`;
      try {
        const r = await api("/api/replay", { repo: l?.repo_id || repo, route, words: box.querySelector("[data-f=kw]").value });
        out.innerHTML = `<p class="hint" style="color:var(--ink)">${esc(r.sentence)}</p>` + (r.examples.length ? `<ul class="replaylist">${r.examples.map((x) => `<li><span class="sub">${esc(shortDate(x.at))} · ${esc(x.where)}</span><div class="mono">${esc(x.text)}</div></li>`).join("")}</ul>` : "");
      } catch (err) { out.innerHTML = `<p class="hint">${esc(err.message)}</p>`; }
      return;
    }
    if (el.dataset.route) {
      const box = el.closest(".detail"); box.querySelectorAll("[data-route]").forEach((b) => b.setAttribute("aria-checked", String(b === el)));
      box.querySelector("[data-when-hint]").textContent = WHEN_HINT[el.dataset.route];
      const kw = box.querySelector("[data-f=kw]"); kw.hidden = el.dataset.route !== "keyword"; if (!kw.hidden) kw.focus(); return;
    }
    if (el.dataset.add) {
      const l = data.suggested.find((x) => x.id === el.dataset.add);
      let body = { id: l.id, action: "keep", route: l.defaults.route, keywords: l.defaults.keywords.join(", "), global: l.defaults.global };
      if (el.dataset.custom) {
        const box = li.querySelector(".detail"); const route = box.querySelector("[data-route][aria-checked=true]").dataset.route; const kws = box.querySelector("[data-f=kw]").value;
        if (route === "keyword" && !kws.trim()) { toast("Add a word, or pick another option."); return; }
        body = { id: l.id, action: "keep", text: box.querySelector("[data-f=text]").value, route, keywords: kws, ...whereBody(box) };
      }
      el.disabled = true; await api("/api/decide", body); open = null; toast("Kept. Agents are told it from their next session."); await refresh(); return;
    }
    if (el.dataset.dismiss) { el.disabled = true; await api("/api/decide", { id: el.dataset.dismiss, action: "reject" }); toast("secondnature won't suggest that again."); await refresh(); return; }
    if (el.dataset.toggle) {
      const l = data.kept.find((x) => x.id === el.dataset.toggle); const turnOff = !l.off;
      el.setAttribute("aria-checked", String(!turnOff));
      await api("/api/decide", { id: l.id, action: turnOff ? "off" : "on" });
      toast(turnOff ? "Off. Agents aren't told this until you switch it back on." : "On. Agents are told this again."); await refresh(); return;
    }
    if (el.dataset.fix) { el.disabled = true; await api("/api/decide", { id: el.dataset.fix, action: "save", route: "always" }); toast("Agents are told it every session now."); await refresh(); return; }
    if (el.dataset.save) {
      const box = li.querySelector(".detail"); const route = box.querySelector("[data-route][aria-checked=true]").dataset.route; const kws = box.querySelector("[data-f=kw]").value;
      if (route === "keyword" && !kws.trim()) { toast("Add a word, or pick another option."); return; }
      el.disabled = true;
      await api("/api/decide", { id: el.dataset.save, action: "save", text: box.querySelector("[data-f=text]").value, route, keywords: kws, ...whereBody(box) });
      open = null; toast("Saved. Agents get the new version from their next session."); await refresh(); return;
    }
    if (el.dataset.remove) {
      if (!confirm("Remove this lesson? Agents won't be told it, and it leaves your list. To pause it instead, switch it off.")) return;
      await api("/api/decide", { id: el.dataset.remove, action: "retire" }); open = null; toast("Removed."); await refresh(); return;
    }
    if (el.dataset.dial) {
      const d = data.home.dial; const startOn = d !== "quiet"; const midOn = d === "anytime";
      // Two switches, three settings: both off = only when asked; start only; start and mid-task.
      const next = el.dataset.dial === "start" ? (startOn ? "quiet" : midOn ? "anytime" : "start") : (midOn ? (startOn ? "start" : "quiet") : "anytime");
      await api("/api/dial", { repo, dial: next });
      toast({ quiet: "secondnature won't tell agents anything here unless they ask.", start: "secondnature tells agents only when a session starts.", anytime: "secondnature tells agents at the start, and mid-task when relevant." }[next]);
      await refresh(); return;
    }
  } catch (err) { toast(err.message); el.disabled = false; }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "histRoutine") { hist.routine = e.target.checked; $("#histList").innerHTML = histList(); return; }
  if (e.target.id === "repo") { repo = e.target.value; runPage = null; if (!repo && tab === "plan") tab = null; week = null; if (!asking) { askThread = []; askThreadId = null; } open = null; showAll = false; planBranch = null; refresh(); }
  if (e.target.id === "planBranch") { planBranch = e.target.value; planEdit = null; Object.assign(hist, { area: "All", q: "", open: {}, limit: 8 }); refresh(); }
});
refresh().catch((e) => { $("#main").innerHTML = `<p class="lead">${esc(e.message)}</p>`; });

// Stay current without a manual reload: reload when muninn's code or this page changes, and refresh the lists
// in the background unless you're editing.
let version = null;
setInterval(async () => {
  try { const v = await api("/api/version"); const key = `${v.boot}:${v.page}`; if (version && key !== version) location.reload(); version = key; } catch { /* restarting */ }
}, 2000);
const quietRefresh = async () => { if (open || document.visibilityState !== "visible" || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")) return; try { await refresh(); } catch { /* try later */ } };
setInterval(quietRefresh, 30000);
window.addEventListener("focus", quietRefresh);
</script>
</body>
